name: Correct manual spacing once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract original file paths
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile
          root=pathlib.Path.cwd().resolve()
          src=root/'manual-payload.zip'
          import base64
          src.write_bytes(base64.b64decode(''))
          assert hashlib.sha256(src.read_bytes()).hexdigest()=='57d5ff566ad9e3f82fe62b0033bbeafa1126dcb39a83a680bf9cf095125f35f0'
          with zipfile.ZipFile(src) as z:
              assert z.testzip() is None
              assert len(z.infolist())==3
              for item in z.infolist():
                  target=(root/item.filename).resolve()
                  assert target.is_relative_to(root) and not pathlib.PurePosixPath(item.filename).is_absolute()
                  assert '.git' not in pathlib.PurePosixPath(item.filename).parts
                  assert not (item.external_attr >> 16 & 0o170000)==0o120000
              z.extractall(root)
          src.unlink()
          bundle=root/'CycleProof_Complete.zip'
          with zipfile.ZipFile(bundle) as z:
              entries=[(i,z.read(i.filename)) for i in z.infolist()]
          with zipfile.ZipFile(root/'updated.zip','w',zipfile.ZIP_DEFLATED) as z:
              for i,body in entries:
                  z.writestr(i,(root/i.filename).read_bytes())
          (root/'updated.zip').replace(bundle)
          PY
          rm -rf .github
          git config user.name 'M J Anthony'
          git config user.email 'mjanthony819@users.noreply.github.com'
          git add -A
          git commit -m 'Correct manual prose spacing and matching ZIP; remove helper'
          git push
