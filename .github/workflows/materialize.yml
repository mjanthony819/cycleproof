name: Materialize verified source once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract original file paths
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile
          root=pathlib.Path.cwd().resolve()
          src=root/'3-CycleProof_Complete.zip'
          assert hashlib.sha256(src.read_bytes()).hexdigest()=='f6c463c3c19a4466f3d9a7b96ff381644b246a28509de9156724721017387bc8'
          with zipfile.ZipFile(src) as z:
              assert z.testzip() is None
              assert len(z.infolist())==30
              for item in z.infolist():
                  target=(root/item.filename).resolve()
                  assert target.is_relative_to(root) and not pathlib.PurePosixPath(item.filename).is_absolute()
                  assert '.git' not in pathlib.PurePosixPath(item.filename).parts
                  assert not (item.external_attr >> 16 & 0o170000)==0o120000
              z.extractall(root)
          src.rename(root/'CycleProof_Complete.zip')
          PY
          rm -rf .github
          git config user.name 'M J Anthony'
          git config user.email 'mjanthony819@users.noreply.github.com'
          git add -A
          git commit -m 'Publish verified original source paths and remove one-time helper'
          git push
